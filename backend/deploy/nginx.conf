# StableSense nginx site. One origin: serves the built frontend from dist/ and
# reverse-proxies /api to the Fastify backend. No CORS needed.
#
# Adjust server_name, then enable TLS (e.g. `sudo certbot --nginx`).

server {
    listen 80;
    server_name stablesense.example.com;

    root /opt/stablesense/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri /index.html;
    }

    # Never cache the API responses in the browser.
    location = /api/ai {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store";
    }
}
