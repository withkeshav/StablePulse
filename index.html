<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
      var key = 'stablescope:theme';
      var mode = 'system';
      try { mode = localStorage.getItem(key) || 'system'; } catch (e) {}
      var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var effective = mode === 'system' ? (dark ? 'dark' : 'light') : mode;
      document.documentElement.setAttribute('data-theme', effective);
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0C0D12">
  <meta name="description" content="StableScope - Professional USDT & USDC Intelligence Platform">
  <title>StableScope</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app"></div>
  <script>
    // Runtime config override (optional). Set apiBase to point the app at a
    // different backend, e.g.: window.STABLESCOPE_CONFIG = { apiBase: 'https://your-host/api' };
    window.STABLESCOPE_CONFIG = window.STABLESCOPE_CONFIG || {};
  </script>
  <script type="module" src="./src/main.jsx"></script>
</body>
</html>
